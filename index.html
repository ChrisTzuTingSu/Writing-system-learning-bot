<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>文字系統互動學習平台</title>
    <script src="data/thai.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --badge-mid: #0284c7;
            --badge-high: #e11d48;
            --badge-low: #7c3aed;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .header-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }

        .lang-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: white;
            font-weight: 600;
        }

        .badge.mid { background-color: var(--badge-mid); }
        .badge.high { background-color: var(--badge-high); }
        .badge.low { background-color: var(--badge-low); }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .grid-item {
            background: var(--card-bg);
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .grid-char {
            font-size: 2.5rem;
            font-family: "Thonburi", "Leelawadee UI", sans-serif;
            margin: 4px 0;
        }

        .grid-info {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn.secondary {
            background-color: #e5e7eb;
            color: var(--text-main);
        }

        .btn.outline {
            background-color: transparent;
            border: 1px solid #d1d5db;
            color: var(--text-main);
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .canvas-area {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto;
            border-radius: 12px;
            background-color: #ffffff;
            border: 2px dashed #d1d5db;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .status-msg {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
            min-height: 20px;
            font-weight: 600;
        }

        .status-msg.error { color: var(--badge-high); }
        .status-msg.success { color: var(--success); }

        .phonetic-box {
            background: #eef2ff;
            border-radius: 8px;
            padding: 8px;
            margin: 8px 0;
            font-size: 0.85rem;
            color: #3730a3;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div id="homePage" class="page active">
        <div class="header-title">文字系統目錄</div>
        <div class="header-desc">選擇欲學習的文字系統，先進行總覽檢視再開始系統化手寫與發音練習。</div>
        <div id="langList"></div>
    </div>

    <div id="overviewPage" class="page">
        <div class="nav-header">
            <button class="btn outline" style="width: auto; padding: 6px 12px;" onclick="showPage('homePage')">← 首頁</button>
            <span id="overviewTitle" class="header-title" style="font-size: 1rem; margin:0;"></span>
        </div>
        <div id="overviewDesc" class="header-desc"></div>
        <button class="btn" style="margin-bottom: 16px;" onclick="startPractice(0)">開始系統化筆順練習</button>
        <div id="overviewGrid" class="overview-grid"></div>
    </div>

    <div id="practicePage" class="page">
        <div class="nav-header">
            <button class="btn outline" style="width: auto; padding: 6px 12px;" onclick="showPage('overviewPage')">← 總覽</button>
            <span id="practiceProgress" style="font-size: 0.85rem; color: var(--text-sub);">1 / 48</span>
        </div>

        <div class="card" style="text-align: center;">
            <div style="display: flex; justify-content: center; gap: 6px; margin-bottom: 6px;">
                <span id="practiceBadge" class="badge"></span>
                <span id="practiceName" style="font-size: 0.9rem; font-weight: 600;"></span>
            </div>

            <div class="phonetic-box">
                <div id="practiceIpa"></div>
                <div id="practiceZhuyin" style="margin-top: 2px; font-weight: 600;"></div>
            </div>

            <div class="canvas-area">
                <canvas id="paintCanvas" width="260" height="260"></canvas>
            </div>

            <div id="statusMsg" class="status-msg">請沿著軌道數字順序滑動完成筆劃</div>

            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button class="btn secondary" onclick="playCurrentAudio()">播放發音</button>
                <button class="btn outline" onclick="resetCanvas()">清除重寫</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <button class="btn secondary" onclick="prevPractice()">上一個</button>
            <button id="nextBtn" class="btn" onclick="nextPractice()">下一個字母</button>
        </div>
    </div>

</div>

<script>
    let registeredLanguages = [];
    let currentLang = null;
    let currentIndex = 0;
    
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let passedCheckpoints = [];

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function initHome() {
        const langList = document.getElementById('langList');
        langList.innerHTML = '';
        registeredLanguages.forEach(lang => {
            if (!lang) return;
            const card = document.createElement('div');
            card.className = 'card lang-card';
            card.onclick = () => openOverview(lang);
            card.innerHTML = `
                <div>
                    <div style="font-weight: 700; font-size: 1.05rem;">${lang.title}</div>
                    <div style="font-size: 0.8rem; color: var(--text-sub); margin-top: 4px;">收錄 ${lang.items.length} 個符號與聲調</div>
                </div>
                <span style="font-size: 1.2rem; color: var(--text-sub);">→</span>
            `;
            langList.appendChild(card);
        });
    }

    function openOverview(lang) {
        currentLang = lang;
        document.getElementById('overviewTitle').innerText = lang.title;
        document.getElementById('overviewDesc').innerText = lang.description;

        const grid = document.getElementById('overviewGrid');
        grid.innerHTML = '';

        lang.items.forEach((item) => {
            const el = document.createElement('div');
            el.className = 'grid-item';
            el.onclick = () => playAudio(item.char, lang.langCode);
            el.innerHTML = `
                <span class="badge ${item.class}" style="position: absolute; top: 8px; left: 8px;">${item.className}</span>
                <div class="grid-char">${item.char}</div>
                <div style="font-weight: 600; font-size: 0.85rem;">${item.name}</div>
                <div class="grid-info">${item.ipa}｜${item.zhuyin}</div>
            `;
            grid.appendChild(el);
        });

        showPage('overviewPage');
    }

    function startPractice(index) {
        currentIndex = index;
        showPage('practicePage');
        loadPracticeItem();
    }

    function renderCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const item = currentLang.items[currentIndex];
        if (!item || !item.checkpoints || item.checkpoints.length === 0) return;

        const pts = item.checkpoints;

        // 1. 繪製標準筆劃底框軌道 (灰色向量路徑)
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
            ctx.lineTo(pts[i].x, pts[i].y);
        }
        ctx.lineWidth = 26;
        ctx.strokeStyle = '#e5e7eb';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();

        // 2. 繪製使用者已完成的填充筆劃 (深色線條)
        if (passedCheckpoints.length > 1) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < passedCheckpoints.length; i++) {
                ctx.lineTo(pts[i].x, pts[i].y);
            }
            ctx.lineWidth = 22;
            ctx.strokeStyle = '#4f46e5';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore();
        }

        // 3. 繪製軌道節點號碼圈
        pts.forEach((pt, idx) => {
            const isPassed = idx < passedCheckpoints.length;
            const isNext = idx === passedCheckpoints.length;

            ctx.save();
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 12, 0, Math.PI * 2);
            ctx.fillStyle = isPassed ? '#10b981' : (isNext ? '#4f46e5' : '#ffffff');
            ctx.fill();
            ctx.strokeStyle = isPassed ? '#059669' : (isNext ? '#3730a3' : '#9ca3af');
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = (isPassed || isNext) ? '#ffffff' : '#4b5563';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(idx + 1, pt.x, pt.y);
            ctx.restore();
        });
    }

    function loadPracticeItem() {
        passedCheckpoints = [];
        const item = currentLang.items[currentIndex];
        
        document.getElementById('practiceProgress').innerText = `${currentIndex + 1} / ${currentLang.items.length}`;
        document.getElementById('practiceName').innerText = item.name + " (" + item.meaning + ")";
        document.getElementById('practiceBadge').innerText = item.className;
        document.getElementById('practiceBadge').className = `badge ${item.class}`;
        document.getElementById('practiceIpa').innerText = "音標與說明：" + item.ipa;
        document.getElementById('practiceZhuyin').innerText = "擬音與發音：" + item.zhuyin;
        
        renderCanvas();
        updateStatus("請由數字 1 開始順應軌道劃過節點", "");
        playCurrentAudio();
    }

    function resetCanvas() {
        passedCheckpoints = [];
        renderCanvas();
        updateStatus("請由數字 1 開始順應軌道劃過節點", "");
    }

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function checkStrokeCheckpoints(pos) {
        const item = currentLang.items[currentIndex];
        if (!item || !item.checkpoints) return;

        const nextIdx = passedCheckpoints.length;
        if (nextIdx >= item.checkpoints.length) return;

        const targetPt = item.checkpoints[nextIdx];
        const dist = Math.hypot(pos.x - targetPt.x, pos.y - targetPt.y);

        // 手指或筆尖距離目標點 32 像素以內，即自動解鎖該段筆劃
        if (dist < 32) {
            passedCheckpoints.push(nextIdx);
            renderCanvas();

            if (passedCheckpoints.length === item.checkpoints.length) {
                updateStatus("筆順正確完成！", "success");
            }
        }
    }

    function startDrawing(e) {
        isDrawing = true;
        const pos = getCanvasPos(e);
        checkStrokeCheckpoints(pos);
    }

    function draw(e) {
        if (!isDrawing) return;
        const pos = getCanvasPos(e);
        checkStrokeCheckpoints(pos);
    }

    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
    canvas.addEventListener('touchend', stopDrawing);

    function nextPractice() {
        const item = currentLang.items[currentIndex];
        const requiredCount = item.checkpoints ? item.checkpoints.length : 0;

        if (passedCheckpoints.length >= requiredCount) {
            if (currentIndex < currentLang.items.length - 1) {
                currentIndex++;
                loadPracticeItem();
            } else {
                alert("已完成本模組所有字母與聲調練習！");
                showPage('overviewPage');
            }
        } else {
            updateStatus("未完全完成軌道筆劃，請依序劃過點位", "error");
        }
    }

    function prevPractice() {
        if (currentIndex > 0) {
            currentIndex--;
            loadPracticeItem();
        }
    }

    function updateStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.innerText = msg;
        el.className = `status-msg ${type}`;
    }

    function playAudio(char, langCode) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(char);
            utterance.lang = langCode;
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }
    }

    function playCurrentAudio() {
        const item = currentLang.items[currentIndex];
        if (item) {
            playAudio(item.char, currentLang.langCode);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (window.thaiData && registeredLanguages.length === 0) {
            registeredLanguages.push(window.thaiData);
        }
        initHome();
    });
</script>
</body>
</html>
